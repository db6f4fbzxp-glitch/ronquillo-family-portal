  if(drag){
    const dx=e.clientX-lmx,dy=e.clientY-lmy;
    if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;
    camRY+=dx*0.005;
    camRX+=dy*0.005;
    camRX=Math.max(-1.5,Math.min(1.5,camRX));
    lmx=e.clientX;lmy=e.clientY;
    hTip.style.display='none';hovN=-1;
    return;
  }
  // Hover detection — find nearest node to cursor
  lastHX=e.clientX;lastHY=e.clientY;
  const r=canvas.getBoundingClientRect();
  const mx2=(e.clientX-r.left)/r.width*2-1,my2=-((e.clientY-r.top)/r.height*2-1);
  const asp2=canvas.width/canvas.height,proj2=m4P(Math.PI/3,asp2,0.5,2000),view2=gVM(),mvp2=m4M(proj2,view2);
  let best=-1,bestD=20;
  for(let i=0;i<N;i++){
    if(al[i]===0)continue;
    const x=px[i],y=py[i],z=pz[i];
    const cx3=mvp2[0]*x+mvp2[4]*y+mvp2[8]*z+mvp2[12];
    const cy3=mvp2[1]*x+mvp2[5]*y+mvp2[9]*z+mvp2[13];
    const cw2=mvp2[3]*x+mvp2[7]*y+mvp2[11]*z+mvp2[15];
    if(cw2<0.01)continue;
    const sx2=cx3/cw2,sy2=cy3/cw2;
    const dx2=(sx2-mx2)*r.width/2,dy2=(sy2-my2)*r.height/2;
    const d=Math.sqrt(dx2*dx2+dy2*dy2);
    if(d<bestD){bestD=d;best=i;}
  }
  if(best>=0){
    hovN=best;
    const nd=DATA.nodes[best];
    htType.textContent=nd.type;htType.style.background=TH2[nd.type]||'#378ADD';
    htTitle.textContent=nd.title;
    // Show associated files
    const files=nd.concepts.filter(c=>c.includes('.')||c.includes('/')||c.includes('docx')||c.includes('pdf')||c.includes('html'));
    htFiles.textContent=files.length>0?files.join(', '):'';
    htConcepts.textContent=nd.concepts.slice(0,6).join(' · ');
    // Position tooltip near cursor
    let tx=e.clientX+16,ty=e.clientY-10;
    if(tx+350>window.innerWidth)tx=e.clientX-360;
    if(ty+100>window.innerHeight)ty=e.clientY-100;
    if(ty<0)ty=10;
    hTip.style.left=tx+'px';hTip.style.top=ty+'px';hTip.style.display='block';
    canvas.style.cursor='pointer';
  } else {
    hovN=-1;hTip.style.display='none';
    canvas.style.cursor='grab';
  }
});
canvas.addEventListener('mouseup',()=>{drag=false;});
canvas.addEventListener('mouseleave',()=>{hTip.style.display='none';hovN=-1;});
// Smooth zoom — can go all the way in
canvas.addEventListener('wheel',e=>{
  camD*=1+e.deltaY*0.001;
  camD=Math.max(10,Math.min(500,camD));
  e.preventDefault();
  // Hide hint on first scroll
  document.getElementById('zoomHint').style.opacity='0';
},{passive:false});

function gVM(){
  const cx=Math.cos(camRX),sx=Math.sin(camRX),cy=Math.cos(camRY),sy=Math.sin(camRY);
  const ex=camD*cx*sy,ey=camD*sx,ez=camD*cx*cy;
  const fl=Math.sqrt(ex*ex+ey*ey+ez*ez)||1;
  const fxn=-ex/fl,fyn=-ey/fl,fzn=-ez/fl;
  const rx=fyn*0-fzn*1,ry=fzn*0-fxn*0,rz=fxn*1-fyn*0;
  const rl=Math.sqrt(rx*rx+ry*ry+rz*rz)||1;
  const rxn=rx/rl,ryn=ry/rl,rzn=rz/rl;
  const ux=ryn*fzn-rzn*fyn,uy=rzn*fxn-rxn*fzn,uz=rxn*fyn-ryn*fxn;
  return new Float32Array([rxn,ux,-fxn,0,ryn,uy,-fyn,0,rzn,uz,-fzn,0,-(rxn*ex+ryn*ey+rzn*ez),-(ux*ex+uy*ey+uz*ez),(fxn*ex+fyn*ey+fzn*ez),1]);
}

let aF='all',selN=-1,sT='',pp=0;
let al=new Float32Array(N); // hoisted for click/hover access
const b1=gl.createBuffer(),b2=gl.createBuffer(),b3=gl.createBuffer(),b4=gl.createBuffer(),b5=gl.createBuffer(),b6=gl.createBuffer(),b7=gl.createBuffer();

function render(time){
  pp=time*0.001;
  if(autoR)camRY+=0.003;

  // Gentle organic float
  for(let i=0;i<N;i++){
    py[i]+=Math.sin(pp*0.7+i*0.37)*0.008;
    px[i]+=Math.cos(pp*0.5+i*0.23)*0.005;
  }

  gl.clearColor(0.039,0.055,0.090,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  gl.disable(gl.DEPTH_TEST);

  const asp=canvas.width/canvas.height;
  const proj=m4P(Math.PI/3,asp,0.5,2000);
  const view=gVM();
  const mvp=m4M(proj,view);

  const pos=new Float32Array(N*3),col=new Float32Array(N*3),sz=new Float32Array(N);al=new Float32Array(N);

  for(let i=0;i<N;i++){
    pos[i*3]=px[i];pos[i*3+1]=py[i];pos[i*3+2]=pz[i];
    const nd=DATA.nodes[i];
    const c=TC[nd.type]||TC.fact;
    const vis=(aF==='all'||nd.type===aF)&&(sT===''||nd.title.toLowerCase().includes(sT)||nd.concepts.some(cc=>cc.toLowerCase().includes(sT)));
    const pulse=1+Math.sin(pp*1.5+i*0.8)*0.2;
    const isSel=i===selN;
    const conn=selN>=0&&adj[selN].includes(i);
    const nConn=adj[i].length;

    col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2];

    if(!vis){sz[i]=0;al[i]=0;}
    else if(isSel){sz[i]=28*pulse*devicePixelRatio;al[i]=1.0;}
    else if(conn){sz[i]=18*pulse*devicePixelRatio;al[i]=0.95;}
    else if(selN>=0){sz[i]=6*devicePixelRatio;al[i]=0.1;}
    else{
      const base=8+nConn*1.5+(nd.strength||5)*0.5;
      sz[i]=base*pulse*devicePixelRatio;
      al[i]=0.5+nConn*0.05;
      if(al[i]>1)al[i]=1;
    }
  }

  // Draw synapses
  const lV=[],lC=[],lA=[];
  DATA.links.forEach(l=>{
    const si=idx[l.s],ti=idx[l.t];
    if(si===undefined||ti===undefined||al[si]===0||al[ti]===0)return;
    let la=0.5;
    // Synapse color = blend of endpoint colors
    const c1=TC[DATA.nodes[si].type]||TC.fact;
    const c2=TC[DATA.nodes[ti].type]||TC.fact;
    if(selN>=0)la=(si===selN||ti===selN)?0.9:0.02;
    lV.push(px[si],py[si],pz[si],px[ti],py[ti],pz[ti]);
    lC.push((c1[0]+c2[0])/2,(c1[1]+c2[1])/2,(c1[2]+c2[2])/2,(c1[0]+c2[0])/2,(c1[1]+c2[1])/2,(c1[2]+c2[2])/2);
    lA.push(la,la);
  });

  if(lV.length>0){
    gl.useProgram(lProg);
    gl.uniformMatrix4fv(gl.getUniformLocation(lProg,'uM'),false,mvp);
    gl.bindBuffer(gl.ARRAY_BUFFER,b5);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(lV),gl.DYNAMIC_DRAW);
    let a=gl.getAttribLocation(lProg,'aP');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,b6);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(lC),gl.DYNAMIC_DRAW);
    a=gl.getAttribLocation(lProg,'aC');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,b7);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(lA),gl.DYNAMIC_DRAW);
    a=gl.getAttribLocation(lProg,'aA');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,1,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.LINES,0,lV.length/3);
  }

  // Draw nodes
  gl.useProgram(pProg);
  gl.uniformMatrix4fv(gl.getUniformLocation(pProg,'uM'),false,mvp);
  gl.bindBuffer(gl.ARRAY_BUFFER,b1);gl.bufferData(gl.ARRAY_BUFFER,pos,gl.DYNAMIC_DRAW);
  let a=gl.getAttribLocation(pProg,'aP');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,b2);gl.bufferData(gl.ARRAY_BUFFER,col,gl.DYNAMIC_DRAW);
  a=gl.getAttribLocation(pProg,'aC');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,b3);gl.bufferData(gl.ARRAY_BUFFER,sz,gl.DYNAMIC_DRAW);
  a=gl.getAttribLocation(pProg,'aS');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,1,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,b4);gl.bufferData(gl.ARRAY_BUFFER,al,gl.DYNAMIC_DRAW);
  a=gl.getAttribLocation(pProg,'aA');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,1,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.POINTS,0,N);

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// Click to select
canvas.addEventListener('click',e=>{
  if(dragMoved)return;
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width*2-1,my=-((e.clientY-r.top)/r.height*2-1);
  const asp=canvas.width/canvas.height,proj=m4P(Math.PI/3,asp,0.5,2000),view=gVM(),mvp=m4M(proj,view);
  let cl=-1,cd=25;
  for(let i=0;i<N;i++){
    if(al[i]===0)continue; // skip hidden
    const x=px[i],y=py[i],z=pz[i];
    const cx2=mvp[0]*x+mvp[4]*y+mvp[8]*z+mvp[12];
    const cy2=mvp[1]*x+mvp[5]*y+mvp[9]*z+mvp[13];
    const cw=mvp[3]*x+mvp[7]*y+mvp[11]*z+mvp[15];
    if(cw<0.01)continue;
    const sx=cx2/cw,sy=cy2/cw;
    const dx2=(sx-mx)*r.width/2,dy2=(sy-my)*r.height/2;
    const d=Math.sqrt(dx2*dx2+dy2*dy2);
    if(d<cd){cd=d;cl=i;}
  }
  if(cl>=0){selN=cl;showD(cl);}
  else{selN=-1;document.getElementById('detail').classList.remove('visible');}
});

function showD(i){
  const n=DATA.nodes[i],p=document.getElementById('detail');
  const t=document.getElementById('detailType');
  t.textContent=n.type;t.style.background=TH[n.type]||'#378ADD';t.style.color='#fff';
  document.getElementById('detailTitle').textContent=n.title;
  document.getElementById('detailContent').textContent=n.content;
  document.getElementById('detailMeta').textContent=n.date+' \u2022 strength '+n.strength+' \u2022 '+adj[i].length+' connections';
  const cd=document.getElementById('detailConcepts');cd.innerHTML='';
  n.concepts.forEach(c=>{const tg=document.createElement('span');tg.className='concept-tag';tg.textContent=c;cd.appendChild(tg);});
  p.classList.add('visible');
}

document.getElementById('detailClose').addEventListener('click',()=>{selN=-1;document.getElementById('detail').classList.remove('visible');});
document.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(bb=>bb.classList.remove('active'));b.classList.add('active');aF=b.dataset.type;}));
document.getElementById('search').addEventListener('input',e=>{sT=e.target.value.toLowerCase();});

// Fade hint after 6 seconds
setTimeout(()=>{document.getElementById('zoomHint').style.opacity='0';},6000);
</script>
